name: fb-watch

# ตัวเตือน FABEL5 บนคลาวด์ — มีไว้เพื่อให้ปิดคอมที่บ้านได้
#   รายการคู่ + ตัวทำนาย : อ่านจากแคชที่งาน fb-cache ดึงไว้ (ไม่แตะ Forebet เลย — IP นี้โดน 403)
#   นาที + สกอร์สด       : ยิง LiveScore เอง (IP Actions ผ่านฉลุย วัดแล้ว 3/3)
#
# ไม่มีแคช / แคชไม่ใช่ของวันนี้ = เงียบ ไม่เตือน (fail-closed)
#   เตือนด้วยรายการเมื่อวานอันตรายกว่าไม่เตือน
#
# ⚠️ วัดจริง 9 ส.ค. 69: cron ตั้งไว้ทุก 5 นาที แต่ตื่นแค่ 2 ครั้ง ห่างกัน 48 นาที
#   หน้าต่างเตือนกว้างแค่ 13 นาที (นาที 45-58) → หลับ 48 นาทีทีเดียวข้ามคู่ทั้งดุ้น
#   → คนปลุกตัวจริงตอนนี้คือ PIKTAX (trigger f5Poke ทุก 5 นาที ยิง workflow_dispatch)
#     วัดแล้ว dispatch ไม่โดนหน่วงเลย created_at = run_started_at เป๊ะทุกรอบ
#   → cron ข้างล่างปล่อยไว้เป็นตัวสำรองเผื่อ GAS เงียบ

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'ไม่ส่งจริง แค่พิมพ์ผล'
        type: boolean
        default: false
      probe:
        description: 'ทดสอบทางส่ง PIKTAX ก่อนเฝ้า (กดมือเท่านั้น)'
        type: boolean
        default: false

concurrency:
  group: fb-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: เอาแคช Forebet ของวันมา
        uses: actions/cache/restore@v4
        with:
          path: fb_day_cache.json.gz
          key: fbcache-
          restore-keys: fbcache-

      # กันเตือนซ้ำข้ามรอบ — ไฟล์เดียวกับ fb_watch_seen.json บนเครื่องบ้าน
      # ไม่ commit กลับ repo เพราะรอบละ 5 นาที = วันละ 288 commit
      - name: เอาบันทึกกันซ้ำรอบก่อนมา
        uses: actions/cache/restore@v4
        with:
          path: fb_watch_seen.json
          key: fbseen-
          restore-keys: fbseen-

      # เช็คว่ากุญแจเดินทางถึง runner จริงและ PIKTAX รับ — กดมือเท่านั้น (ติ๊ก probe)
      # ห้ามผูกกับ workflow_dispatch เฉยๆ เพราะตอนนี้ GAS ปลุกด้วย dispatch ทุก 5 นาที
      # = ยิง GAS เปล่าๆ วันละ 288 ครั้ง (กินโควตา UrlFetch ของ PIKTAX ฟรีๆ)
      - name: ทดสอบทางส่ง PIKTAX
        if: inputs.probe
        env:
          PIKTAX_STATE_URL: ${{ secrets.PIKTAX_STATE_URL }}
          PIKTAX_ADMIN_KEY: ${{ secrets.PIKTAX_ADMIN_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          u = (os.environ.get("PIKTAX_STATE_URL") or "").split("?")[0]
          k = os.environ.get("PIKTAX_ADMIN_KEY", "").strip()
          print("url:", "มี" if u else "ไม่มี", "· key:", "มี" if k else "ไม่มี", f"({len(k)} ตัว)")
          r = requests.get(u, params={"admin": k, "action": "f5dump"}, timeout=90)
          print("f5dump → HTTP", r.status_code, "·", len(r.text), "ตัวอักษร ·", repr(r.text[:60]))
          PY

      # ⚠️ ห้ามใส่ TELEGRAM_BOT_TOKEN ตรงนี้ — send() จะเลือกทางนั้นก่อน แล้วข้าม f5alert
      #    ซึ่งแปลว่าใบเตือนจะไม่ถูกจดลงชีต → ตอบสกอร์ใต้ใบเตือนแล้วไม่มีอะไรรับ
      - name: เฝ้ารอบเดียว
        env:
          FB_CACHE: read
          FB_NO_LIVELOG: '1'
          PIKTAX_STATE_URL: ${{ secrets.PIKTAX_STATE_URL }}
          PIKTAX_ADMIN_KEY: ${{ secrets.PIKTAX_ADMIN_KEY }}
          PYTHONUTF8: '1'
        run: python fb_watch.py --once ${{ inputs.dry && '--dry' || '' }}

      - name: จำไว้ว่าเตือนอะไรไปแล้ว
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fb_watch_seen.json
          key: fbseen-${{ github.run_id }}
