name: Run Football Scraper

# เรียกมือล้วน — สั่งผ่าน /บอลสด ใน Telegram (PIKTAX ยิง workflow_dispatch) · ปิด auto cron แล้ว (กันเผาโควตา Gemini ฟรี 20/วัน)
on:
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          # SDK ใหม่ (รองรับคีย์ AQ.) — ถ้าลงไม่ผ่าน ไม่ต้องล้มงาน main.py มีเส้นทาง REST สำรองอยู่แล้ว
          pip install --upgrade "google-genai>=1.29.0" || echo "⚠️ ลง google-genai ไม่ผ่าน → จะใช้เส้นทาง REST แทน"

      # ⭐ สำคัญ: ส่ง Secrets เข้าไปให้ main.py (ของเดิมขาดบล็อกนี้ → รันแล้ว error ทุกครั้ง)
      #    KEY2-4 = คีย์สำรอง (ไม่ตั้งก็ได้ ค่าจะว่าง) · คีย์เต็มโควตา 20/วัน → main.py สลับตัวถัดไปเอง
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIKTAX_STATE_URL: ${{ secrets.PIKTAX_STATE_URL }}
        run: python main.py
